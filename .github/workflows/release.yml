# 태그 push(v*)가 릴리스의 시작점이다.
# 패키징 자체는 로컬과 동일하게 scripts/package-app.sh 만 호출한다(zero-dep 원칙 유지 —
# 릴리스 산출물이 로컬 실행과 CI 실행에서 같은 절차로 만들어진다).
name: Release

on:
  push:
    tags:
      - "v*"
  # 수동 실행은 main에서만 허용하며, 검증 후 릴리스 태그를 생성한다.
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v0.1.0-beta.6). `-` 가 들어가면 prerelease 로 공개된다."
        required: true
        type: string

permissions:
  contents: write   # gh release create 에 필요
  actions: read     # 이 커밋의 CI 성공 실행을 발행 전에 확인

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment: release
    # ci.yml 과 동일 러너/툴체인 — 릴리스 산출물이 CI 가 검증한 것과 같은 컴파일러로 만들어진다.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require trusted release ref
        env:
          RELEASE_READY: ${{ vars.WAPLE_RELEASE_READY }}
        run: |
          if [[ "$RELEASE_READY" != "true" ]]; then
            echo "::error::Configure the protected release environment and its WAPLE_RELEASE_READY variable."
            exit 1
          fi
          RELEASE_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "::error::The release commit must be on main."
            exit 1
          fi
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Toolchain facts
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # swift test 는 여기서 다시 실행하지 않는다. 대신 아래 preflight 가 **이 정확한 SHA**의
      # ci.yml + spec.yml 성공 실행을 API 로 확인한다. 태그 push 때 세 워크플로가 동시에
      # 시작하므로 missing/pending 은 제한시간 동안 기다리고, failure/cancelled 는 즉시 막는다.

      # Read dispatch inputs through env and validate before writing GITHUB_ENV.
      - name: Extract version from tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a release tag such as v0.2.0 or v0.2.0-beta.1."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"                # v 접두사 제거 → 0.2.0
          PLIST_VERSION="${VERSION%%-*}"    # 프리릴리즈 접미사 제거 → 0.1.0 (CFBundleShortVersionString 은 숫자+점만 허용)
          echo "WAPLE_VERSION=$PLIST_VERSION" >> "$GITHUB_ENV"
          echo "WAPLE_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Releasing version: $VERSION (plist: $PLIST_VERSION, build $GITHUB_RUN_NUMBER)"

      - name: Require successful CI and spec for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait up to 20 minutes for both workflows on the exact source commit.
          set -euo pipefail
          for attempt in {1..60}; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100" \
              > "$RUNNER_TEMP/actions-runs.json"
            if ci_attempt=$(python3 scripts/dev/check-release-ci.py "$RELEASE_SHA" "$RUNNER_TEMP/actions-runs.json"); then
              read -r run_id run_attempt <<< "$ci_attempt"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100" \
                > "$RUNNER_TEMP/ci-jobs.json"
              python3 scripts/dev/check-release-ci.py --jobs "$RUNNER_TEMP/ci-jobs.json"
              exit 0
            else
              rc=$?
            fi
            case "$rc" in
              1) exit 1 ;;
              2)
                if [ "$attempt" -eq 60 ]; then
                  echo "::error::CI/spec 가 20분 안에 둘 다 성공하지 않았다."
                  exit 1
                fi
                echo "CI/spec 대기 ($attempt/60) — 20초 뒤 재확인"
                sleep 20
                ;;
              *) echo "::error::CI/spec 판정 helper 오류 rc=$rc"; exit "$rc" ;;
            esac
          done

      # LICENSE/NOTICE 는 동봉 WEAssets 의 재배포 권리를 Waple 이 보유한다고 단정하지 않는다.
      # 워크플로도 권리를 추정하지 않는다. 저장소 운영자가 근거를 확인하고 이 repository
      # variable 을 명시적으로 true 로 둔 경우에만 공개 산출물 패키징으로 넘어간다.
      - name: Require distribution approval
        env:
          DISTRIBUTION_APPROVED: ${{ vars.WAPLE_WE_ASSETS_DISTRIBUTION_APPROVED }}
        run: |
          if [ "$DISTRIBUTION_APPROVED" != "true" ]; then
            echo "::error::WEAssets 배포 승인 확인이 없다. repository variable WAPLE_WE_ASSETS_DISTRIBUTION_APPROVED=true 를 권리 근거 확인 후 설정해야 한다."
            exit 1
          fi
          echo "WEAssets 배포 승인 preflight 통과(권리 자체를 이 워크플로가 판정한 것은 아니다)."

      - name: Refuse to clobber an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi
          bash scripts/dev/check-release-tag.sh preflight "$RELEASE_TAG" "$RELEASE_SHA"

      # Developer ID 서명/공증은 secrets 이 설정된 경우에만 활성화된다.
      # 모두 비어 있을 때만 ad-hoc을 허용한다. 일부만 설정한 경우는 오류다.
      # 필요한 secrets(6개, docs/RELEASING.md §서명/공증 참조):
      #   DEVELOPER_ID_APPLICATION   "Developer ID Application: NAME (TEAMID)"
      #   DEVELOPER_ID_CERT_P12      .p12 를 base64 로 인코딩한 문자열
      #   DEVELOPER_ID_CERT_PASSWORD .p12 내보내기 암호
      #   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD  (앱 암호 방식)
      - name: Detect signing configuration
        id: signing
        env:
          DEV_ID: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -n "$DEV_ID" ] && [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ] \
             && [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] \
             && [ -n "$NOTARY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "WAPLE_SIGN_IDENTITY=$DEV_ID" >> "$GITHUB_ENV"
            echo "Developer ID 서명 + 공증 모드: $DEV_ID"
          elif [ -z "$DEV_ID$CERT$CERT_PASSWORD$NOTARY_APPLE_ID$NOTARY_TEAM_ID$NOTARY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WAPLE_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "secrets 미설정 — ad-hoc 서명으로 진행(공증 없음, 첫 실행 Gatekeeper 안내가 릴리스 노트에 붙는다)"
          else
            echo "::error::Configure all six signing secrets in the release environment."
            exit 1
          fi

      # 러너는 매 실행 새 VM 이라 인증서가 없다 — 임시 키체인을 만들어 .p12 를 임포트한다.
      # 임시 키체인을 쓰는 이유: login 키체인을 건드리지 않고 잡 종료 시 통째로 지우기 위함.
      # set-key-partition-list 를 빼면 codesign 이 키 접근에서 GUI 프롬프트를 기다리다 잡이 멈춘다.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/waple-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "WAPLE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # 검색 목록에 임시 키체인을 **앞에** 둔다(login 은 유지 — 다른 스텝이 쓸 수 있다).
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "임포트된 서명 아이덴티티:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # WAPLE_VERSION/WAPLE_BUILD/WAPLE_SIGN_IDENTITY 는 앞 스텝들이 GITHUB_ENV 로 주입한다.
      - name: Package app (Waple.app + Waple.dmg)
        run: scripts/package-app.sh

      # Developer ID 로 서명된 경우에만 공증(notarization) 후 티켓을 DMG 에 스테이플한다.
      # 앱 암호(app-specific password) 방식 — 러너에 미리 저장된 notary 프로파일이 없기 때문이다
      # (`--keychain-profile` 은 `notarytool store-credentials` 를 먼저 돌린 머신에서만 통한다).
      # staple 까지 해야 오프라인에서도 Gatekeeper 가 티켓을 확인할 수 있다.
      - name: Notarize DMG
        if: steps.signing.outputs.available == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit Waple.dmg \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple Waple.dmg
          # 검증: 스테이플된 티켓과 서명이 실제로 통과하는지 확인한다(실패면 릴리스를 만들지 않는다).
          xcrun stapler validate Waple.dmg
          spctl -a -vvv -t open --context context:primary-signature Waple.dmg

      - name: Compute SHA-256
        run: |
          SHA="$(shasum -a 256 Waple.dmg | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_ENV"
          shasum -a 256 Waple.dmg

      # 공개 규약: 태그에 "-" 가 있으면(semver 프리릴리즈, 예: v0.1.0-beta.1) draft 없이
      # 즉시 prerelease 로 공개한다. 정식 태그는 draft 로 생성 — 웹 UI 에서 검토 후 Publish.
      # 본문은 영어(README 와 동일 기조, 공개 대상). sha256 은 Homebrew cask 갱신에 그대로 쓴다.
      # 첫 실행 Gatekeeper 안내는 ad-hoc 서명일 때만 붙인다 — Developer ID + 공증이 켜지면
      # 그 안내가 거짓이 되므로 signing 스텝 출력으로 분기한다.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## Waple ${RELEASE_TAG}

          Download \`Waple.dmg\`, open it, and drag **Waple.app** into \`/Applications\`.
          Requires macOS 14 or later on Apple Silicon.

          ### Verify

          \`\`\`
          SHA-256 (Waple.dmg): ${sha256}
          \`\`\`
          EOF
          if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
            cat >> release-notes.md <<'EOF'

          ### First launch

          This build is **ad-hoc signed and not notarized**, so Gatekeeper blocks the first launch.
          Approve it once with either:

          ```
          xattr -dr com.apple.quarantine /Applications/Waple.app
          ```

          …or right-click the app and choose *Open*.
          EOF
          fi
          cat >> release-notes.md <<'EOF'

          Supported wallpaper types and the scene feature matrix are in the
          [README](../../blob/main/README.md). When updating a Homebrew cask, use the sha256 above
          (see `docs/RELEASING.md` §3).
          EOF
          echo "--- release notes ---"; cat release-notes.md
          FLAGS="--draft"
          case "$RELEASE_TAG" in
            *-*) FLAGS="--prerelease" ;;
          esac
          # An existing tag wins over gh release create --target. Bind it first.
          TAG_MODE=require
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG_MODE=create; fi
          bash scripts/dev/check-release-tag.sh "$TAG_MODE" "$RELEASE_TAG" "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" Waple.dmg \
            "$FLAGS" \
            --verify-tag \
            --title "Waple ${RELEASE_TAG}" \
            --notes-file release-notes.md

      # 임시 키체인은 러너와 함께 사라지지만, 실패 경로에서도 남기지 않도록 명시적으로 지운다.
      - name: Clean up signing keychain
        if: always() && env.WAPLE_KEYCHAIN != ''
        run: security delete-keychain "$WAPLE_KEYCHAIN" || true
