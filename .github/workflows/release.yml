# 태그 push(v*)가 릴리스의 시작점이다.
# 패키징 자체는 로컬과 동일하게 scripts/package-app.sh 만 호출한다(zero-dep 원칙 유지 —
# 릴리스 산출물이 로컬 실행과 CI 실행에서 같은 절차로 만들어진다).
name: Release

on:
  push:
    tags:
      - "v*"
  # 태그 push 가 정식 경로다. 여기에 수동 실행을 하나 더 둔 이유는 **태그를 못 미는 자격증명**이
  # 있기 때문이다(브랜치 push 만 허용되는 세션에서 `git push origin <tag>` 이 HTTP 403 이다).
  # 그때도 프리뷰 빌드를 낼 수 있어야 한다. 태그는 `gh release create --target <sha>` 가
  # 그 커밋에 만들어 준다 — 즉 태그 없이 시작해도 결과물은 태그 경로와 같다.
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v0.1.0-beta.6). `-` 가 들어가면 prerelease 로 공개된다."
        required: true
        type: string

permissions:
  contents: write   # gh release create 에 필요

jobs:
  release:
    # ci.yml 과 동일 러너/툴체인 — 릴리스 산출물이 CI 가 검증한 것과 같은 컴파일러로 만들어진다.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain facts
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # swift test 는 여기서 실행하지 않는다 — ci.yml 워크플로가 이미 push/PR 마다
      # 전수 테스트를 돌리므로, 태그는 "테스트가 그린인 커밋"에만 붙인다는 운영 전제를 둔다.
      # (릴리스 잡에서 다시 돌리면 macOS 러너 비용/시간이 2배로 든다.)

      # 두 경로(태그 push · 수동 실행)가 **같은 변수 하나**로 합류한다. 이 아래로는
      # `GITHUB_REF_NAME` 을 쓰지 않는다 — 수동 실행에서는 그것이 브랜치 이름이라 태그가 아니다.
      - name: Extract version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::릴리스 태그는 v 로 시작해야 한다 — 받은 값: '$TAG'"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          VERSION="${TAG#v}"                # v 접두사 제거 → 0.2.0
          PLIST_VERSION="${VERSION%%-*}"    # 프리릴리즈 접미사 제거 → 0.1.0 (CFBundleShortVersionString 은 숫자+점만 허용)
          echo "WAPLE_VERSION=$PLIST_VERSION" >> "$GITHUB_ENV"
          echo "WAPLE_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Releasing version: $VERSION (plist: $PLIST_VERSION, build $GITHUB_RUN_NUMBER)"

      # 발행된 릴리스를 덮어쓰지 않는 것은 옳다. 문제는 **언제** 그걸 알아차리느냐였다 —
      # 2026-08-17 태그를 재지목(force push)했더니 워크플로가 다시 돌아, 빌드·패키징·
      # 공증 게이트·SHA 계산을 전부 끝낸 **마지막 스텝**에서 "a release with the same tag
      # name already exists" 로 죽었다(런 31987727378). 3분을 태우고 나서 아무 것도 하지
      # 않는 것이 확정됐고, 실행 이력엔 릴리스가 깨진 것처럼 빨간 줄이 남는다.
      #
      # 전제 검사를 파괴적/비싼 단계 **앞**으로 옮긴다. 기존 릴리스는 건드리지 않는다.
      - name: Refuse to clobber an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::릴리스 $RELEASE_TAG 이 이미 발행돼 있다. 태그 재지목만으로는 덮어쓰지 않는다."
            echo "다시 내려면 새 태그를 쓰거나, 의도적이라면 먼저 지워라: gh release delete $RELEASE_TAG"
            exit 1
          fi
          echo "릴리스 $RELEASE_TAG 없음 — 진행한다."

      # Developer ID 서명/공증은 secrets 이 설정된 경우에만 활성화된다.
      # 하나라도 없으면 ad-hoc 서명으로 폴백한다(로컬 패키징과 동일) — 릴리스가 멈추지 않는다.
      # 필요한 secrets(4개, docs/RELEASING.md §서명/공증 참조):
      #   DEVELOPER_ID_APPLICATION   "Developer ID Application: NAME (TEAMID)"
      #   DEVELOPER_ID_CERT_P12      .p12 를 base64 로 인코딩한 문자열
      #   DEVELOPER_ID_CERT_PASSWORD .p12 내보내기 암호
      #   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD  (앱 암호 방식)
      - name: Detect signing configuration
        id: signing
        env:
          DEV_ID: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -n "$DEV_ID" ] && [ -n "$CERT" ] && [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "WAPLE_SIGN_IDENTITY=$DEV_ID" >> "$GITHUB_ENV"
            echo "Developer ID 서명 + 공증 모드: $DEV_ID"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WAPLE_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "secrets 미설정 — ad-hoc 서명으로 진행(공증 없음, 첫 실행 Gatekeeper 안내가 릴리스 노트에 붙는다)"
          fi

      # 러너는 매 실행 새 VM 이라 인증서가 없다 — 임시 키체인을 만들어 .p12 를 임포트한다.
      # 임시 키체인을 쓰는 이유: login 키체인을 건드리지 않고 잡 종료 시 통째로 지우기 위함.
      # set-key-partition-list 를 빼면 codesign 이 키 접근에서 GUI 프롬프트를 기다리다 잡이 멈춘다.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/waple-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "WAPLE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # 검색 목록에 임시 키체인을 **앞에** 둔다(login 은 유지 — 다른 스텝이 쓸 수 있다).
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "임포트된 서명 아이덴티티:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # WAPLE_VERSION/WAPLE_BUILD/WAPLE_SIGN_IDENTITY 는 앞 스텝들이 GITHUB_ENV 로 주입한다.
      - name: Package app (Waple.app + Waple.dmg)
        run: scripts/package-app.sh

      # Developer ID 로 서명된 경우에만 공증(notarization) 후 티켓을 DMG 에 스테이플한다.
      # 앱 암호(app-specific password) 방식 — 러너에 미리 저장된 notary 프로파일이 없기 때문이다
      # (`--keychain-profile` 은 `notarytool store-credentials` 를 먼저 돌린 머신에서만 통한다).
      # staple 까지 해야 오프라인에서도 Gatekeeper 가 티켓을 확인할 수 있다.
      - name: Notarize DMG
        if: steps.signing.outputs.available == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit Waple.dmg \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple Waple.dmg
          # 검증: 스테이플된 티켓과 서명이 실제로 통과하는지 확인한다(실패면 릴리스를 만들지 않는다).
          xcrun stapler validate Waple.dmg
          spctl -a -vvv -t install Waple.dmg || true

      - name: Compute SHA-256
        run: |
          SHA="$(shasum -a 256 Waple.dmg | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_ENV"
          shasum -a 256 Waple.dmg

      # 공개 규약: 태그에 "-" 가 있으면(semver 프리릴리즈, 예: v0.1.0-beta.1) draft 없이
      # 즉시 prerelease 로 공개한다. 정식 태그는 draft 로 생성 — 웹 UI 에서 검토 후 Publish.
      # 본문은 영어(README 와 동일 기조, 공개 대상). sha256 은 Homebrew cask 갱신에 그대로 쓴다.
      # 첫 실행 Gatekeeper 안내는 ad-hoc 서명일 때만 붙인다 — Developer ID + 공증이 켜지면
      # 그 안내가 거짓이 되므로 signing 스텝 출력으로 분기한다.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<EOF
          ## Waple ${RELEASE_TAG}

          Download \`Waple.dmg\`, open it, and drag **Waple.app** into \`/Applications\`.
          Requires macOS 14 or later on Apple Silicon.

          ### Verify

          \`\`\`
          SHA-256 (Waple.dmg): ${sha256}
          \`\`\`
          EOF
          if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
            cat >> release-notes.md <<'EOF'

          ### First launch

          This build is **ad-hoc signed and not notarized**, so Gatekeeper blocks the first launch.
          Approve it once with either:

          ```
          xattr -dr com.apple.quarantine /Applications/Waple.app
          ```

          …or right-click the app and choose *Open*.
          EOF
          fi
          cat >> release-notes.md <<'EOF'

          Supported wallpaper types and the scene feature matrix are in the
          [README](../../blob/main/README.md). When updating a Homebrew cask, use the sha256 above
          (see `docs/RELEASING.md` §3).
          EOF
          echo "--- release notes ---"; cat release-notes.md
          FLAGS="--draft"
          case "$RELEASE_TAG" in
            *-*) FLAGS="--prerelease" ;;
          esac
          # `--target` 이 있어야 수동 실행에서 **이 커밋에** 태그가 생긴다(태그 push 경로에서는
          # 이미 그 커밋이라 무해하다).
          gh release create "$RELEASE_TAG" Waple.dmg \
            $FLAGS \
            --target "$GITHUB_SHA" \
            --title "Waple ${RELEASE_TAG}" \
            --notes-file release-notes.md

      # 임시 키체인은 러너와 함께 사라지지만, 실패 경로에서도 남기지 않도록 명시적으로 지운다.
      - name: Clean up signing keychain
        if: always() && env.WAPLE_KEYCHAIN != ''
        run: security delete-keychain "$WAPLE_KEYCHAIN" || true
