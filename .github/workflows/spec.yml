name: spec

# **paths-ignore 가 없다.** 그게 이 워크플로가 따로 있는 이유다.
#
# `ci.yml` 은 문서 전용 푸시로 macOS 러너(잡당 ~10분)를 태우지 않으려고 `**.md`·`docs/**` 를
# 무시한다 — 그 판단 자체는 옳다. 문제는 **spec 정본의 근거 중 `.md` 파일이 있다는 것**이다
# (`spec/engine/shape-quad.json` · `spec/golden/nondeterminism.json` 의 확정 4항목).
# 그 `.md` 만 지우는 커밋은 근거를 끊으면서 CI 를 통째로 건너뛴다. 실측: 커밋 `33e68d4`
# (md 2파일 173행)에 대응하는 CI 실행이 없다. 다음 코드 커밋에서 잡히므로 영구 우회는
# 아니지만, **지연되는 동안 정본이 근거 없이 초록**이다.
#
# 여기 있는 것은 전부 ubuntu 에서 수십 초에 끝나는 검사라 항상 돌려도 비용이 무시할 만하다.
# macOS 잡은 `ci.yml` 에 그대로 두고 paths-ignore 도 유지한다.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # [2026-08-19] spec/ 파이썬 툴체인을 CI 에 넣는다.
  #
  # 종전엔 spec/** 변경이 paths-ignore 에 없어 macOS 러너를 태우면서도 validate.py 도
  # spec 테스트도 한 번도 돌지 않았다. 검사가 없어서 실제로 놓친 사고가 있다:
  # 동봉 WE 에셋 302개가 CRLF→LF 로 정규화된 채 커밋됐고, manifest.json 이 그 손상된
  # 바이트로 기준선을 떠서 자체 검증은 영원히 통과하는 상태였다.
  # GPU 도 Xcode 도 필요 없으므로 Linux 러너에서 10초면 끝난다 — macOS 잡과 동시에 돈다.
  #
  # [2026-08-19] `ci.yml` 에서 이 파일로 옮겼다 — paths-ignore 를 벗기기 위해서다(위 헤더 주석).
  spec:
    name: spec · python
    # [2026-08-21] `ubuntu-latest` → **`ubuntu-24.04` 고정**.
    #
    # 오늘은 **동작이 완전히 같다**. 1차 자료(actions/runner-images README 라벨 표)가
    # `| Ubuntu 24.04 | x64 | ubuntu-latest or ubuntu-24.04 |` 로 두 라벨을 **같은 칸**에 싣고,
    # 이 잡의 프로브(`1fb7ad2`)가 실제 러너에서 `os=Ubuntu 24.04.4 LTS`·`image=20260816.277.1` 을
    # 찍었다. 즉 이 커밋은 기존 게이트 20종의 실행 환경을 **바꾸지 않는다** — 지금 도는 그 이미지를
    # 이름으로 고정할 뿐이다.
    #
    # 고정하는 이유는 아래 타입체크 관측 스텝이다. 같은 README 가 `Ubuntu 26.04`(preview)를
    # 싣고 "`-latest` 이전은 1~2개월에 걸쳐 점진적으로 일어난다" 고 공지한다. 라벨이 움직이면
    #   ① 관측 결과가 **어느 툴체인의 것인지 모르는 값**이 되어 4단계(게이트) 승격의 근거가 못 된다
    #      — 관측은 게이트가 돌 환경과 같은 환경에서 재야 근거가 이월된다.
    #   ② `install-swift.sh` 가 이미지 빌드 시점의 `apple/swift` releases/latest 를 따라가므로
    #      Swift 버전도 함께 움직인다.
    #   ③ 게이트 20종이 어느 날 조용히 다른 배포판에서 돌게 된다.
    # 셋 다 "조용히 달라진다" 부류라 이 리포가 반복해서 당한 그것이다.
    #
    # 되돌리는 법: 26.04 로 올릴 때는 라벨만 바꾸지 말고 이 잡을 한 번 손으로 돌려
    # (`workflow_dispatch`) 관측 스텝의 rc 와 툴체인 줄을 다시 읽어라.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate spec canon
        run: python3 scripts/spec/validate.py

      - name: Spec self-tests
        run: |
          python3 scripts/spec/tests/test_validate.py
          python3 scripts/spec/tests/test_rosetta.py
          # 2026-08-21: 리포에 있는데 CI 에서 한 번도 안 돌던 자체검사다. MDLA 프레이밍
          # 픽스처를 바이트로 잠그므로 `measure_mdl_deep.parse_mdla` 회귀를 여기서 잡는다.
          python3 scripts/spec/tests/test_mdla_framing.py

      # 신뢰 경계 밖(.pkg / scene.json / project.json) 숫자의 정수 좁힘이 가드를 건너뛰면 실패한다.
      # Swift 의 Int(Float)·Int32(Int) 는 범위 밖에서 클램프가 아니라 **트랩**이라, 가드 없는
      # 한 줄이면 워크샵 배경화면 하나가 앱을 죽인다. 2026-08-19 스윕에서 13곳이 나왔다.
      # 스크립트 자체의 음성 대조(가드를 풀면 정말 실패하는지)는 doc 주석 참조.
      - name: Untrusted int narrowing guards
        run: python3 scripts/spec/check_int_narrowing.py

      # 이 리포는 GLSL/MSL/JS 를 Swift 다중행 문자열 리터럴에 통째로 싣는다
      # (TextScriptEngine.shims 880행, Mesh3DShaders.source, EffectShaders.frags …).
      # 거기에 정규식을 그대로 붙여 넣으면 `\s` 가 **Swift 의 잘못된 이스케이프**가 되어
      # 컴파일이 깨진다. JS 쪽에선 완벽히 정상인 코드라 눈으로 안 보이고, macOS 러너에서만
      # 잡혀 왕복이 한 번 더 든다 — 2026-08-19 에 이 사고를 연달아 두 번 냈다.
      # 스크립트는 실행 때마다 자기 음성 대조(--selftest)를 먼저 돌린다.
      - name: Swift string-literal escapes
        run: python3 scripts/spec/check_swift_escapes.py

      # [2026-08-20] enum 연관값 개수와 패턴 매치가 어긋나는 곳.
      #
      # `EffectBind.translated` 에 연관값을 하나 더했을 때 소비처 한 곳이 둘만 바인딩하고
      # 있었는데, 컴파일러가 이 부류에 진단을 못 만들어서
      #   SceneRenderer.swift:584:21: error: failed to produce diagnostic for expression
      # 로만 떴다 — 줄 번호는 맞지만 원인이 안 보인다. 렌더 계층은 Metal/AppKit 의존이라
      # 리눅스에서 빌드가 안 되고 macOS 왕복이 10분이라, 이 부류는 여기서 끝내는 게 맞다.
      #
      # 놓친 경위도 남긴다: 변경 직후 `\.translated(passes` 로 grep 했는데 문제의 자리는
      # 라벨 없는 **위치 패턴**이라 안 걸렸다. 라벨 형태만 찾는 grep 은 이 부류를 못 잡는다.
      # 스크립트는 실행 때마다 자기 음성 대조(--selftest)를 먼저 돌린다.
      - name: Swift enum pattern arity
        run: python3 scripts/spec/check_swift_enum_patterns.py

      # JS 심이 동봉 `baseclasses.js` 와 공존 가능한지 본다.
      #
      # baseclasses 는 Vec2/Vec3/Vec4/Mat3/Mat4/MediaPlaybackEvent 를 `class` 로 선언한다
      # = 전역 **렉시컬** 바인딩이다. 심이 같은 이름을 `function` 으로 선언하면 같은 컨텍스트에서
      # 공존할 수 없고, 어느 쪽을 먼저 평가하든 **두 번째 스크립트가 통째로** SyntaxError 로 죽는다
      # — 한 문장이 아니라 그 컨텍스트의 씬 스크립트가 전부 함께 사라진다.
      #
      # 심 리터럴을 Swift 에서 그대로 뽑아 node vm 에 넣고, ① 심 단독 ② baseclasses+심 양쪽에서
      # Waple 소유 표면(shared.camera · createScriptProperties 의 무-_config · MediaPlaybackEvent
      # 필드)이 유지되는지와 ③ 조합에서 WE 의 Vec4/Mat3/Mat4 가 도달하는지를 본다.
      # 음성 대조: 심을 옛 형태로 되돌린 사본이 실제로 SyntaxError 를 내는지 매 실행 확인한다.
      - name: JS shim / baseclasses coexistence
        run: python3 scripts/spec/check_js_shim_baseclasses.py

      # 동봉 이펙트가 참조하는 텍스처가 **실제로 해석되는지** 본다.
      #
      # 스톡 3종(refraction·waterflow·waterripple)이 자기 노멀맵/위상맵을 못 찾아 흰색 1×1
      # 폴백으로 돌고 있었다. 흰색은 곱셈 항등원이라 "효과가 약한 것" 처럼 보이고, 노멀맵
      # 자리에서는 (1,1,1) 언팩이 상시 대각 변위가 된다 — **조용히 틀린 그림**이라 눈으로
      # 잡기 어렵다. 렌더 계층은 리눅스에서 빌드가 안 되지만 이 부류는 순수 파일시스템
      # 검사라 여기서 끝낼 수 있다.
      #
      # 음성 대조(실측): 팩 루트만 보면 3건 미해석, **이펙트-로컬 스코프만 더해도 여전히
      # 3건**(스코프에는 `.tex` 가 없다), 소스 폼(.png)까지 봐야 0건이 된다. 진단이 "스코프
      # 문제" 에서 멈췄으면 못 고쳤을 자리다. 스크립트는 실행 때마다 --selftest 를 먼저 돈다.
      - name: Effect texture resolution
        run: python3 scripts/spec/check_effect_texture_resolution.py

      # `TEXnFORMAT` 배선이 딛고 선 실측 표 셋(FORMAT_* enum · tex-json↔tex 짝 · Swift 리터럴)이
      # 어긋나지 않는지 매번 다시 잰다. 이 배선은 "조용히 틀린 그림" 부류다 — 정의가 없으면
      # 전처리기가 0 을 주고 노멀 언팩이 잘못된 분기를 타는데, 화면엔 "효과가 좀 약하네" 로 보인다.
      #
      # 세 실측이 서로 물려 있다: ② 짝 272쌍이 표를 만들고, ① 셰이더 enum 이 그 값의 정의역이며,
      # ③ Swift 리터럴이 실제로 먹이는 값이다. 셋 중 하나만 바뀌어도 나머지가 근거를 잃는다.
      # 덤으로 (D) 이름 유추를 배반하는 집합(`rgb888`→0), (E) `.tex` 를 제외하는 규칙의 근거인
      # TexDecoder 정규화, (F) 슬롯 판정이 `formatcombo` 기준인지, (G) 실제 도달 자산 1건을 고정한다.
      # F 가 특히 중요하다 — 첫 구현은 `samplerCombos`(`"combo"`)로 슬롯을 골라서 정작 고치려던
      # refract.frag:8 이 안 걸렸다(그 줄엔 `"combo"` 가 없다). 아무것도 안 하는 수정이었다.
      - name: TEXnFORMAT map
        run: python3 scripts/spec/check_tex_format_map.py

      # 주석 속 **주소 범위 인용**의 산술 불변식(시작 < 끝)만 본다. 바이너리가 필요 없어서
      # 여기서 돈다 — 형제 `scripts/dev/check-rdata-citations.py` 는 WE 바이너리를 요구하므로
      # CI 게이트가 될 수 없고, 그 공백이 실제로 사고를 냈다.
      #
      # `.rdata` 는 **파일 오프셋 + 0x1200 = RVA** 인데 주석이 두 규약을 같은 `@0x48XXXX` 표기로
      # 섞어 썼다. `0c54f3b` 이 32건을 일괄 정정했는데 **그 치환이 범위의 시작만 고치고 끝을
      # 남겼다** — `@0x48f3c0–0x48e2b8` 처럼 시작 > 끝 인 불가능한 범위가 12건 남았고(Sources 8 ·
      # Tests 4) 검사기가 단일 주소만 보게 돼 있어 아무도 안 잡았다. 근거가 그럴듯한 다른 것을
      # 가리키는 부류라 파일이 없는 경우보다 발견이 늦다.
      #
      # 예외 목록을 두지 않는다. `check_swift_enum_patterns` 의 제외 목록이 **원격 스위치**였던
      # 전례가 있다 — 아무 데나 한 줄 두면 검사가 무력화되는데 화면엔 숫자만 찍혔다. 정정 주석이
      # 옛 값을 인용해야 하면 두 주소를 나란히 적지 말고 떼어 쓴다(실제로 그렇게 했다).
      - name: Address range citations
        run: python3 scripts/spec/check_address_ranges.py

      # 정본을 **다시 만들 수 있는지** 본다 — 생성기의 키 집합 == 정본의 키 집합.
      #
      # 정본은 생성기 산출물인데, 사실이 바뀌면 손으로 고칠 때가 있다(생성기가 코퍼스나 SDK 를
      # 요구해 이 레인에서 못 도는 경우가 특히 그렇다). 그때 키 집합이 갈리면 **재생성이 축소
      # 가드에 막힌다** — `specfmt.dump` 가 키 소멸을 거절하는데 생성기는 손으로 더한 키를
      # 모르니 재생성이 곧 축소가 된다. 정본이 고아가 되는 것이다.
      #
      # 이 상태는 조용하다. validate.py 는 generatedBy 가 실재하는지만 보고, 축소 가드는 **쓸 때**
      # 발동하므로 아무도 재생성을 시도하지 않으면 영영 안 드러난다. 실제로 두 건이 그 상태였다 —
      # mdl-deep 의 `경계` 키, 그리고 `3a369eb` 가 손으로 다시 쓴 material-schema 갭 5건.
      #
      # 값이 아니라 키 집합만 본다. 건너뛴 수(비리터럴 entry)를 화면에 찍어 그물 크기를 숨기지 않고,
      # 대조 건수 하한으로 "패턴이 안 맞아 0건 대조로 통과" 를 막는다. --selftest 를 먼저 돈다.
      - name: Canon regenerability
        run: python3 scripts/spec/check_canon_generator_keys.py

      # 위 게이트의 **명시된 구멍**을 메운다 — 그 게이트는 키 집합만 보고 값은 안 본다.
      #
      # 정본은 손으로 고칠 수 있고(생성기가 코퍼스를 요구해 이 레인에서 못 돌 때가 특히 그렇다),
      # 손으로 고친 문장이 생성기에 안 들어가면 **재생성이 그 정정을 되돌린다.** 키는 그대로이므로
      # 형제 게이트는 초록이고, 축소 가드도 키가 안 사라졌으니 초록이다. 아무도 재생성을 시도하지
      # 않으면 영영 안 드러난다.
      #
      # 실제로 두 건이 그 상태였다(이 게이트를 만들며 발견): `waple.gap.strictJSON` 의 `note` 는
      # 정본만 갭 해소에 맞춰 시제를 과거로 고쳐 뒀고, `waple.gap.composeAndConditions` 의
      # `갭 아님` 은 정본만 `replacementkey` 가 `fafcd21` 로 소비된다고 고쳐 뒀다.
      #
      # 값이 **리터럴인 키만** 본다(f-string·변수는 코퍼스가 있어야 알 수 있다). 비교 못 한 값의
      # 내역을 화면에 찍어 그물 크기를 숨기지 않고, 대조 건수 하한으로 "패턴이 안 맞아 0건 대조로
      # 통과" 를 막는다. selftest 를 먼저 돈다.
      - name: Canon regenerability (values)
        run: python3 scripts/spec/check_canon_generator_values.py

      # 정본이 **산문으로 가리키는 다른 항목**이 실재하는지. 형제 게이트 둘 다 못 잡는 구멍이다 —
      # `check_canon_generator_keys.py` 는 정본에 없는 엔트리 id 를 건너뛰고(`if eid not in lits:
      # continue`), `validate.py` 는 `crossRef`/`supersedes`/`canonicalIn` 세 키만, 그마저 경고로
      # 본다. 실제로 `format.mdl.parseCoverage` 가 없는 항목을 참조한 채로 통과하고 있었다.
      - name: Canon cross-references resolve
        run: python3 scripts/spec/check_canon_entry_refs.py

      # 갭 문서(`docs/re/bundled-key-coverage.md` · `unimplemented-json-keys.md`)는 **한 방향으로만
      # 썩는다** — 갭이 구현돼도 표는 "없음/언급만/미구현" 인 채 남는다. 실제로 §5-A 가 "진짜 구멍
      # 10개" 라고 못박은 키가 **열 개 전부 이미 구현된** 상태로 오래 있었다. 지도가 실제보다
      # 비관적이면 다음 사람이 이미 닫힌 갭을 다시 판다.
      - name: Gap docs are current
        run: python3 scripts/spec/check_gap_docs_current.py

      # 자산 JSON 관용 파스의 **도달**과 **배선**을 함께 본다.
      #
      # WE 는 jsoncpp 의 allowComments/allowTrailingCommas 를 둘 다 켠다(0x140091fe2·0x1400920b3).
      # 관용은 이펙트 매니페스트만의 성질이 아니라 WE 가 읽는 **모든 JSON 의 성질**이고, WE 자기
      # 자산이 실제로 거기 의존한다. 종전 Waple 은 EffectManifest 만 관용이라
      # `fantasticcar/materials/car/glass.json:6`(줄 주석)이 통째로 파스 실패했고 —
      # `models/car/body.mdl` 이 그 경로를 담으므로 그 메시의 textures·blending·
      # constantshadervalues 가 전부 유실됐다.
      #
      # 게이트는 셋을 본다. ① 두 자산 트리에서 엄격 파스 실패 건을 세고 **전건이 관용으로
      # 복구되는지** ② 그 목록에 고정 자산 둘이 실제로 들어 있는지 ③ **자산 리더가 AssetJSON 을
      # 실제로 부르는지**(함정 ③ 주입≠소비 — 관용 파서가 있어도 리더가 안 부르면 아무 일도
      # 안 일어난다. 실제로 그 상태였다). 하한으로 "측정이 조용히 0건" 도 막는다.
      #
      # 설치본 `ui/` 는 범위에서 뺐다 — WE UI(Chromium) 캐시라 벽지 자산이 아니고, 그 안에
      # 루트 뒤 추가 데이터를 가진 JSONL 이 있어 관용으로도 안 읽힌다(읽을 이유도 없다).
      - name: Lenient asset JSON
        run: python3 scripts/spec/check_lenient_json_reach.py

      # 씬을 **어떻게 마운트하는가**가 렌더러와 호환성 스캐너에서 갈려 있었다. 스캐너의 계약은
      # "이슈 없음 = 렌더 가능" 이라, 규약이 갈리는 순간 그 보장이 양방향으로 거짓이 된다.
      # 실측(리눅스 드라이버 6케이스, 수정 전): 이름이 관례가 아닌 `.pkg` 씬은 렌더러가 정상으로
      # 여는데 스캐너가 error/missingScenePackage 로 단정했고(거짓 치명), 문서가 깨진 언팩 씬은
      # 이슈 없이 통과했다(거짓 통과). 더 큰 쪽은 후자의 원인이다 — 스캐너가 `.pkg` 가 없으면
      # 그냥 빠져나가서 **언팩 씬을 한 건도 검사하지 않았다.** 동봉 WEAssets 실측으로 그 범위가
      # 그대로 나온다: 씬 프로젝트 170개가 전부 언팩이고 `.pkg` 는 0개다.
      # 이 게이트는 두 후보 목록이 글자 그대로 같은지, 스캐너에 언팩 폴백이 살아 있는지,
      # 렌더러가 `sceneFileName: project.fileName` 을 계속 넘기는지를 본다.
      - name: Scene mount parity
        run: python3 scripts/spec/check_scene_mount_parity.py --selftest

      # 정본이 **조용히 줄어드는 것**을 막는다.
      #
      # spec/ 아래 정본은 measure_*.py 가 만들고, 그 입력은 WE 설치본과 워크샵 코퍼스다.
      # 입력이 없으면 대부분 exit(1) 로 막지만 안 막는 것들이 있었고, 그것들은 **입력
      # 0건에서 측정한 결과를 `확정` 으로 기록하며 성공**했다. 2026-08-20 실측:
      #   · measure_binaries.py    entries 32 → 0  ("0 항목" 을 찍고도 rc=0, 근거 706줄 삭제)
      #   · measure_mdl_deep.py    파일수/메시수 451/986 → 0/0, 관측버전 {}
      #   · measure_render_pass.py d3d11Slots 9개 키 → 빔
      # 입력이 **아예 없을 때**보다 **부분적으로만 있을 때**가 더 위험하다 — 전자는 파일
      # 열기에서 죽지만 후자는 끝까지 돌아 성공을 보고한다. "WE_ROOT 가 설정됐는가" 같은
      # 조건으로는 못 잡는다.
      #
      # 가드는 생성기 33개가 전부 지나는 단일 관문 specfmt.dump 에 있다. 이 검사는 그
      # 가드가 살아 있는지를 본다: 양성 대조(줄어드는 쓰기는 막혀야) · 음성 대조(늘거나
      # 그대로면 통과해야) · 실사 대조(커밋된 정본에서 위 열화를 재구성해 잡히는지) ·
      # 관문 우회(생성기가 specfmt.dump 를 건너뛰지 않는지). 쓰기는 전부 임시 디렉터리로
      # 가므로 이 검사는 리포의 정본을 건드리지 않는다.
      - name: Spec shrink guard
        run: python3 scripts/spec/check_spec_shrink_guard.py

      # 직교투영 분기의 근거 수치를 강제한다.
      #
      # 파티클 주입기 아홉 개가 상수를 ortho/원근으로 가르는데, 어느 쪽을 채택하느냐가 곧
      # 화면이다. 그 선택의 근거가 주석에만 있었더니 **세 숫자로 갈라졌다** —
      # `343/347 = 98.8%`, `347/355`, 그리고 둘을 섞은 `347/355 = 98.8%`(산술도 틀렸다).
      # 실제로는 범위가 달랐다: 동봉 트리 단독 169/171 = 98.8%, 두 트리+설치본 projects
      # 347/355 = 97.7%. 근거를 코드로 옮기지 않으면 이렇게 갈라진다.
      #
      # 더 중요한 건 백분율이 아니라 **원근 판정 씬이 조건부 상수 원소를 아예 쓰지 않는다**는
      # 것이다. 그게 깨지면 그 씬에서 ortho 상수가 틀린 값이 되므로, 검사는 도수와 그 불변식을
      # 함께 본다. 판정 함수는 실물 게이트(objectValue 태그 7 → bool `auto` → width·height)를
      # 그대로 옮겼고, 문자열 `"auto"` 나 비-불 `auto` 가 탈락하는지 매 실행 음성 대조한다.
      - name: Orthogonal projection census
        run: python3 scripts/spec/check_ortho_projection_census.py

      # 파티클 원소 도수를 정본에 고정하고 매 실행 다시 센다.
      #
      # 이 리포의 파티클 주석은 "동봉 35인스턴스 중 …" 같은 도수를 근거로 값을 고른다.
      # 그런데 동봉 트리에는 프리셋 원본과 **바이트 동일한 프리뷰 사본**이 섞여 있어, 같은
      # 질문에 두 개의 정답이 있다 — 전수(all)와 내용 중복 제거(unique). 라벨 없이 숫자만
      # 적으면 나중 사람이 다른 범위로 재집계해 "틀렸다" 고 판단하고 값을 뒤집는다.
      # 실제로 controlpointattract 가 35 로 적혀 있었고 전수는 34 였다.
      #
      # measure_particle_corpus.py 가 두 범위를 **함께** 재고 키별 부재 도수까지 남기며,
      # 이 검사가 그 정본을 다시 세어 대조한다. 도수를 인용하는 주석은 범위 라벨과 이 정본을
      # 함께 가리켜야 한다.
      - name: Particle corpus census
        run: python3 scripts/spec/check_particle_corpus_census.py

      # 재생 정책 정본과 그 순수 모델이 같은 값을 담는지 본다.
      #
      # `playbackfocus`/`playbackmaximized`/… 여섯 축과 `pausevram` 은 전부 한 줄짜리
      # 상수라 "보고 옮기면 되는" 것처럼 보이고, 그래서 틀린다. 실제로 모델 초안이
      # 축별 허용 열거에서 한 자리 틀렸다 — UI 옵션 빌더 `function k(e,t,a)` 의 첫 인자가
      # 축마다 `t`(=multimonitor)와 리터럴 `!1` 로 갈리는데 전부 `t` 인 줄 알았다.
      # 그 상태면 audio/sleep/battery 에 WE 가 주지 않는 `pauseall` 을 제시하게 된다.
      #
      # 정본은 바이너리(매퍼 0x140141880–0x14014191b · 설치자 0x140046f20–0x1400483be ·
      # 평가기 0x14006cea0–0x14006e0bc)와 UI 번들에서 **다시 읽어** 만들지만, 정본과 구현이
      # 갈리면 아무도 안 운다 — 정본은 자기 근거만 보고 Swift 는 자기 테스트만 본다.
      # 이 검사가 그 사이를 잇는다. Swift 소스를 텍스트로 읽으므로 컴파일러도 WE 설치본도
      # 필요 없다. 실행할 때마다 --selftest(정본 값을 흔든 사본 13종이 전부 잡히는가)를
      # 먼저 돈다.
      - name: Playback policy parity
        run: python3 scripts/spec/check_playback_policy.py

      # 작업 부산물이 소스 트리에 커밋되는 것을 막는다.
      #
      # `git add -A` 한 번에 `Sources/WapleCore/ParticleSystem.swift.orig`(91KB)가 딸려
      # 들어간 적이 있다. 확장자가 `.swift` 가 아니라 **Swift 관문 셋이 전부 그것을 건너뛰었고**,
      # 그 안에는 이미 유령으로 판명나 지운 시그니처가 살아 있었다 — 폐기된 코드가 게이트에
      # 보이지 않는 채로 근거 행세를 한다. SwiftPM 도 unhandled file 로 경고한다.
      - name: Stray artifacts
        run: python3 scripts/spec/check_stray_artifacts.py

      # 동봉 에셋이 매니페스트와 어긋나면 실패한다.
      #
      # measure_assets.py 를 돌려 git diff 로 보는 방법은 쓰지 않는다 — 그 스크립트의
      # hashes 딕셔너리는 os.walk 삽입 순서를 따르는데 디렉터리 순회 순서가 파일시스템마다
      # 달라서, 내용이 같아도 JSON 줄 순서가 갈려 거짓 실패가 난다. 순서 무관하게
      # 의미로 비교한다.
      - name: Asset manifest integrity
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys

          SRC = "Sources/WapleRender/Resources/WEAssets"
          man = json.load(open("spec/assets/manifest.json", encoding="utf-8"))
          inv = json.load(open("spec/assets/inventory.json", encoding="utf-8"))
          committed = next(e for e in man["entries"] if e["id"] == "assets.fileHashes")["value"]
          claimed_bytes = next(e for e in inv["entries"] if e["id"] == "assets.totalBytes")["value"]
          claimed_count = next(e for e in inv["entries"] if e["id"] == "assets.fileCount")["value"]

          actual, total = {}, 0
          for dirpath, _, files in os.walk(SRC):
              for f in files:
                  p = os.path.join(dirpath, f)
                  rel = os.path.relpath(p, SRC).replace(os.sep, "/")
                  total += os.path.getsize(p)
                  h = hashlib.sha256()
                  with open(p, "rb") as fh:
                      for chunk in iter(lambda: fh.read(1 << 20), b""):
                          h.update(chunk)
                  actual[rel] = h.hexdigest()[:16]

          missing = sorted(set(committed) - set(actual))
          extra = sorted(set(actual) - set(committed))
          bad = sorted(k for k in set(committed) & set(actual) if committed[k] != actual[k])

          def show(label, items):
              if items:
                  print(f"{label}: {len(items)}")
                  for k in items[:20]:
                      print(f"   {k}")
                  if len(items) > 20:
                      print(f"   ... 외 {len(items) - 20}건")

          show("매니페스트에 있으나 파일 없음", missing)
          show("파일은 있으나 매니페스트에 없음", extra)
          show("해시 불일치", bad)

          ok = not (missing or extra or bad)
          if total != claimed_bytes:
              print(f"totalBytes 불일치: 실측 {total} vs 정본 {claimed_bytes}")
              ok = False
          if len(actual) != claimed_count:
              print(f"fileCount 불일치: 실측 {len(actual)} vs 정본 {claimed_count}")
              ok = False
          if ok:
              print(f"에셋 {len(actual)}개 / {total} bytes — 매니페스트와 일치")
          sys.exit(0 if ok else 1)
          PY

      # CRLF 무결성. .gitattributes 가 WEAssets 트리 전체를 -text 로 덮는데, 종전엔
      # 확장자를 열거해서 *.tex-json 과 *.js 가 그물을 빠져나갔다. 열거로 돌아가는
      # 회귀를 잡는다 — 위 해시 검사와 달리 이건 **git 인덱스 쪽** 상태를 본다.
      - name: WEAssets EOL attributes
        run: |
          BAD=$(git ls-files --eol -- Sources/WapleRender/Resources/WEAssets \
                | grep -v 'attr/-text' | head -20 || true)
          if [ -n "$BAD" ]; then
            echo "-text 가 적용되지 않은 동봉 에셋이 있다 (.gitattributes 확인):"
            echo "$BAD"
            exit 1
          fi
          echo "동봉 에셋 $(git ls-files -- Sources/WapleRender/Resources/WEAssets | wc -l | tr -d ' ')개 전부 attr/-text"

      # ── [2026-08-21] 프로브. **게이트가 아니다 — 절대 실패하지 않는다.** ──────────
      #
      # 왜 있는가: `scripts/dev/linux-render-typecheck.sh`(`fd5532b`)가 `Sources/WapleRender/**`
      # 를 리눅스에서 **타입체크**한다. `swiftc -parse` 는 타입체크를 하지 않아 그 공백에서
      # macOS CI 가 두 번 깨졌는데(`b98db0a`·`bb5f902`), 이 도구는 두 번째 부류를 잡는다
      # (양성 대조 실측: `SceneRendererResources.swift` 의 `1214:51 texW`·`1214:69 texH` 를
      # macOS 빌드 로그와 행·열까지 똑같이 지목). 즉 이 레인의 게이트로 승격할 값어치가 있다.
      # **다만 아직 근거가 없다.**
      #
      # 확정(1차 자료 실측, 2026-08-21):
      #   · `actions/runner-images` README — `ubuntu-latest` = **Ubuntu 24.04**.
      #   · `images/ubuntu/Ubuntu2404-Readme.md`(이미지 `20260816.277.1`) — **Swift 6.3.3** 동봉.
      #   · `images/ubuntu/scripts/build/install-swift.sh` — `/usr/share/swift` 에 풀고
      #     `/usr/local/bin/{swift,swiftc}` 로 심링크, `SWIFT_PATH=/usr/share/swift/usr/bin`.
      #
      # 미해결(그래서 아직 게이트가 아니다):
      #   · 이 도구를 검증한 로컬 툴체인은 **6.0.3** 이다. 6.3.3 이 **손으로 적은** 심 15종에
      #     새 진단을 내는지 여기서는 잴 수 없다.
      #   · 도구가 `-swift-version` 을 넘기지 않으므로 러너의 **기본 언어 모드가 5** 라는 전제가
      #     깨지면 그대로 무너진다. 아래 스니펫이 그것을 잰다.
      #   · `install-swift.sh` 는 이미지 빌드 시점의 `apple/swift` **releases/latest** 를 따라간다 —
      #     즉 러너의 Swift 는 이미지 갱신마다 **움직인다**. `ubuntu-latest` 라벨 자체도 26.04 로
      #     이동 중(README 의 공개 프리뷰 공지). 게이트를 넣는다면 `ubuntu-24.04` 로 고정할 것.
      #
      # 그래서 먼저 **재기만 한다.** `set +e` 로 돌고 마지막 명령이 `:` 라 어떤 경우에도 rc=0 이다.
      # 로컬 음성 대조(2026-08-21): swift 가 PATH 에 **없을 때**도 rc=0(전건 `command not found`),
      # **있을 때**도 rc=0. 초록을 깨뜨릴 수 없다.
      # 이 프로브를 읽은 다음에 무엇을 할지(판단 규칙 + 붙일 YAML)는 `docs/dev/linux-typecheck.md`
      # 의 "CI" 절에 그대로 적어 뒀다. **읽기 전에 게이트를 넣지 마라.**
      #
      # ── [2026-08-21] **답이 나왔다.** 실제 CI 로그(위 판단 규칙의 입력) ─────────────
      #   image=20260816.277.1  arch=x86_64  cores=4  mem=15989MB   ← 이 컨테이너와 같은 사양
      #   os=Ubuntu 24.04 LTS · SWIFT_PATH=/usr/share/swift/usr/bin
      #   swift/swiftc -> /usr/local/bin/*  ·  Swift 6.3.3  ·  rc(swift --version)=0
      #   flock: yes  ·  rc(기본 언어 모드 typecheck)=0   ← 모드 5. 도구의 전제가 선다
      # `docs/dev/linux-typecheck.md` §CI 2단계 표에서 이 줄이 뽑힌다:
      #   "버전이 6.3.3 + 언어 모드 rc=0 → **3단계(관측)를 먼저 돌려라.**"
      # 그래서 아래 관측 스텝을 붙였다. **프로브는 남긴다** — 관측 스텝이 재지 않는 것
      # (기본 언어 모드)을 이쪽이 매 실행 다시 재고, 그 전제가 깨지는 날 먼저 보인다.
      - name: Probe swift on runner
        run: |
          set +e
          echo "image=${ImageVersion:-unknown}  arch=$(uname -m)  cores=$(nproc)  mem=$(free -m | awk '/^Mem:/{print $2}')MB"
          echo "os=$( (. /etc/os-release && echo "$PRETTY_NAME") 2>/dev/null || echo unknown )"
          echo "SWIFT_PATH=${SWIFT_PATH:-<unset>}"
          echo "swift  -> $(command -v swift  || echo '<none>')"
          echo "swiftc -> $(command -v swiftc || echo '<none>')"
          swift --version; echo "rc(swift --version)=$?"
          command -v flock >/dev/null && echo "flock: yes" || echo "flock: no"

          # 기본 언어 모드 판정. 이 두 줄은 **모드 6 에서만** 오류가 된다.
          # 로컬 6.0.3 실측: 기본 rc=0 · `-swift-version 5` rc=0 · `-swift-version 6` rc=1
          #   (`main actor-isolated var 'probeGlobal' can not be mutated from a nonisolated context`).
          # 즉 rc=0 이면 러너 기본 모드도 5 이고, 도구의 전제가 선다.
          printf 'var probeGlobal = 0\nfunc probeBump() { probeGlobal += 1 }\n' > "$RUNNER_TEMP/probe.swift"
          swiftc -typecheck "$RUNNER_TEMP/probe.swift" 2>&1 | head -5
          echo "rc(기본 언어 모드 typecheck)=${PIPESTATUS[0]}   # 0 이면 모드 5(로컬과 동일)"
          :

      # ── [2026-08-21] 스텝 B — **관측**. 게이트가 아니다. 초록을 깨뜨리지 않는다. ─────
      #
      # 위 프로브가 러너 툴체인(Swift 6.3.3 · 기본 언어 모드 5 · flock 있음 · 4코어)을 확정했고,
      # `0a9755e` 가 커버를 55/55(제외 0)로 닫아 "도구가 움직이는 중" 이라는 보류 사유도 없앴다.
      # 남은 미해결은 하나다: **로컬 6.0.3 ↔ 러너 6.3.3.** 심 17종은 애플 헤더에서 뽑은 것이
      # 아니라 손으로 적은 것이라(`docs/dev/linux-typecheck.md` 한계 ②), 새 컴파일러가 진단을
      # 추가하면 그대로 빨간불이 된다. **그 차이를 초록을 깨지 않고 재는 것이 이 스텝의 전부다.**
      # 여기서 나오는 진단이 곧 4단계(차단 게이트) 승격의 작업 목록이다.
      #
      # 초록을 지키는 장치가 **셋**이다. 셋 다 서로를 대체하지 않는다:
      #   ① `continue-on-error: true` — 스텝 실패가 잡 conclusion 을 failure 로 만들지 않는다.
      #      이 리포의 실측이다(`ci.yml` 의 release 레인 `Test` 스텝).
      #   ② 본문 `set +e` + 마지막 `:` — 스텝 rc 자체를 0 으로 고정한다. ①과 달리 이것은
      #      **로컬에서 `bash -e` 로 직접 검증할 수 있다**(아래 실측). 검증 가능한 쪽을 겹쳐 둔다.
      #   ③ 내부 `timeout 420` — 스텝이 매달려 잡의 `timeout-minutes: 10` 을 먹으면 그건 잡 취소라
      #      ①②와 무관하게 초록이 깨진다. 예산: 기존 20게이트 15~28초 + 420초 = 448초 < 600초.
      #
      # 그런데 **초록으로 만드는 것과 결과가 보이는 것은 다른 명제다.** 이 리포는 그 함정을
      # 이미 겪었다 — `continue-on-error` 가 release 레인의 실패를 통째로 삼켜서 자동 검출이
      # 0이었다(`ci.yml` 의 `Flag release-only failure` 주석). 그래서 결과를 세 곳에 띄운다:
      # 실행 페이지 상단의 `::warning::` · 잡 요약(`$GITHUB_STEP_SUMMARY`)의 파일별 진단 표 ·
      # 로그의 기계 판독용 한 줄 `TYPECHECK_OBSERVATION rc=<n> toolchain=<...>`.
      #
      # 본문 로컬 실측(2026-08-21, 이 YAML 에서 뽑아 `bash -e` 로 그대로 돌림 — 4경로 전부 스텝 rc=0):
      #   · 정상   : 55파일 타입체크 rc=0, 벽시계 66초(도구 자체 CPU user+sys 약 63초)
      #   · 진단   : 스텁으로 `error:` 3건 → rc=1, 요약에 파일별 표(WebRenderer 2 · …Resources 1)
      #   · 시간초과: `timeout` 을 2초로 줄인 사본 → rc=124, 요약이 "예산 문제" 로 갈라 적는다
      #   · 툴체인 없음: `SWIFT_PATH` 미설정 + PATH 에 swiftc 없음 → rc=2, 경고 정상 출력
      - name: WapleRender linux typecheck (관측 전용 — 게이트 아님)
        continue-on-error: true
        run: |
          set +e
          # 도구가 실제로 쓰는 툴체인을 **한 곳에서** 정한다 — 아래 요약이 같은 값을 보고해야
          # "무엇으로 잰 결과인가" 가 로그만 보고 확정된다.
          # `SWIFT_PATH` 를 먼저 쓴다: `/usr/local/bin` 에는 심링크만 있고 실체는 `/usr/share/swift/usr/bin` 이다
          # (러너 프로브 실측 `1fb7ad2`: `SWIFT_PATH=/usr/share/swift/usr/bin`, `swift -> /usr/local/bin/swift`).
          SWIFT_BIN="${SWIFT_PATH:-$(dirname "$(command -v swiftc)")}"
          TOOLCHAIN="$("$SWIFT_BIN/swiftc" --version 2>/dev/null | head -1)"
          [ -n "$TOOLCHAIN" ] || TOOLCHAIN="<$SWIFT_BIN/swiftc 없음>"

          # `timeout` 을 **안에서도** 건다 — 이중 안전장치다. 스텝이 매달려 잡의 `timeout-minutes: 10` 을
          # 먹으면 그건 잡 취소라 `continue-on-error` 와 무관하게 초록이 깨진다. 예산 계산:
          # 기존 20게이트 실측 15~28초 + 이 스텝 최대 420초 = 448초 < 600초(잡 상한).
          # 로컬 실측(4코어 컨테이너, 55파일): 심 ~7초 + WapleCore emit-module ~22초 + 타입체크 29~36초,
          # 도구가 쓴 CPU `user+sys` 약 63초 · 벽시계 1분 05초. 420초는 그 6배 여유다.
          timeout 420 env \
            WAPLE_SWIFT_BIN="$SWIFT_BIN" \
            WAPLE_LINUX_TYPECHECK_DIR="$RUNNER_TEMP/waple-typecheck" \
            WAPLE_SWIFT_LOCK="$RUNNER_TEMP/waple-swift.lock" \
            scripts/dev/linux-render-typecheck.sh 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
          rc=${PIPESTATUS[0]}
          # 기계가 읽는 한 줄. `scripts/dev/ci-status.py --log <JOB_ID>` 에서 이것만 grep 하면 된다.
          echo "TYPECHECK_OBSERVATION rc=$rc toolchain=$TOOLCHAIN"

          {
            echo "### 리눅스 타입체크 — 관측 전용(게이트 아님) · rc=\`$rc\`"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 러너 이미지 | \`${ImageVersion:-unknown}\` · \`$( (. /etc/os-release && echo "$PRETTY_NAME") 2>/dev/null || echo unknown )\` |"
            echo "| 툴체인 | \`$SWIFT_BIN\` — \`$TOOLCHAIN\` |"
            echo "| 커버 | \`$(scripts/dev/linux-render-typecheck.sh --list 2>/dev/null | head -1)\` |"
            echo ""
            if [ "$rc" -eq 0 ]; then
              echo "러너 툴체인에서도 **rc=0**. 로컬 6.0.3 과 러너가 같은 판정을 냈다 —"
              echo "\`docs/dev/linux-typecheck.md\` §CI 의 미해결 사유 (1)(버전 차이)이 이 실행으로 해소된다."
            elif [ "$rc" -eq 124 ]; then
              echo "⏱ **420초 시간 초과.** 진단이 아니라 예산 문제다(로컬 실측 벽시계 1분 05초)."
              echo "게이트 승격 전에 러너에서의 실제 소요부터 다시 재라."
            else
              echo "진단이 나왔다. **심(shim)이 러너 컴파일러와 어긋난 것인지 실제 코드 결함인지 먼저 가른 뒤에**"
              echo "게이트로 올려라 — 심 17종은 애플 헤더에서 뽑은 것이 아니라 손으로 적은 것이다"
              echo "(\`docs/dev/linux-typecheck.md\` 한계 ②)."
              echo ""
              PERFILE=$(grep -oE "[^/ ]+\.swift:[0-9]+:[0-9]+: error:" "$RUNNER_TEMP/typecheck.log" \
                | sed -E 's/:[0-9]+:[0-9]+: error://' | sort | uniq -c | sort -rn | head -20)
              if [ -n "$PERFILE" ]; then
                echo "파일별 오류 수:"
                echo ""
                echo '```'
                echo "$PERFILE"
                echo '```'
                echo ""
              fi
              echo "<details><summary>원문 (최대 40줄)</summary>"
              echo ""
              echo '```'
              grep -E "error:|!!" "$RUNNER_TEMP/typecheck.log" | head -40
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 요약은 잡 페이지를 열어야 보인다. 실행 페이지 **상단**에도 띄운다 — 이 리포는
          # `continue-on-error` 가 실패를 조용히 삼키는 것을 이미 겪었다(`ci.yml` 의 release 레인:
          # run 32218275170 · 32230929535 에서 `Show failure summary` 가 통째로 skipped 였다).
          [ "$rc" -eq 0 ] || echo "::warning title=리눅스 타입체크 관측 rc=$rc::게이트가 아니라 관측 단계다. 잡 요약에 파일별 진단이 있다. 심(shim) 문제인지 실제 코드 문제인지 가른 뒤에 게이트로 올려라 — docs/dev/linux-typecheck.md §CI."
          # **마지막 명령은 반드시 `:` 다.** 스텝 rc 를 0 으로 고정한다. `continue-on-error: true` 만으로도
          # 잡은 초록이지만(위 release 레인이 그 실측이다), 그건 **여기서 검증할 수 없는 성질**이다.
          # 본문이 어떤 경우에도 rc=0 이라는 것은 로컬에서 `bash -e` 로 직접 확인할 수 있다 —
          # 검증 가능한 쪽을 택한다. 두 장치는 겹치는 것이지 대체하는 것이 아니다.
          :
