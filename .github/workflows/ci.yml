      # 선언 목록을 소스에서 뽑는 것은 위 "이름을 하드코딩하지 않는 이유" 와 같은 이유다.
      # ══════════════════════════════════════════════════════════════════════
      - name: Skip / execution census
        if: always()
        run: |
          echo "### swift · ${{ matrix.configuration }}" >> "$GITHUB_STEP_SUMMARY"
          # 빌드가 먼저 깨지면 로그 자체가 없다 — 그 사실을 요약에 남긴다.
          # (종전엔 파일 없음이 그대로 스텝 실패가 되어 진짜 실패 원인을 가렸다.)
          if [ ! -f test-output.log ]; then
            echo "- 테스트 미실행(빌드 단계에서 중단)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SKIPPED=$(grep -c "' skipped (" test-output.log || true)
          # Swift 툴체인에 따라 xctest 번들이 하나이거나 타깃별 여러 개다. 마지막 `Executed`
          # 줄은 마지막 번들(필터 실행에서는 0건 번들)일 뿐이므로, 최상위 `*.xctest` 완료
          # 요약만 합산한다. 클래스/`All tests` 중첩 요약은 helper 가 제외한다.
          EXECUTED=$(python3 scripts/dev/xctest-census.py test-output.log)
          echo "- executed: \`${EXECUTED}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- skipped:  \`${SKIPPED}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "executed=${EXECUTED} skipped=${SKIPPED}"

          # (상한 100 — 대량 무음 스킵 트립와이어) — 근거는 이 스텝 위 YAML 주석에 있다.
          # run 블록 밖으로 옮긴 이유도 거기 적었다(21,000바이트 한도).
          if [ "${SKIPPED:-0}" -gt 100 ]; then
            echo "::error::스킵 ${SKIPPED}건 — 상한 100 초과. GPU/코퍼스 없이 대량 스킵되고 있을 가능성이 크다."
            exit 1
          fi
          # (하한 3875 — 실행 수 래칫과 그 이력) — 근거는 이 스텝 위 YAML 주석에 있다.
          # run 블록 밖으로 옮긴 이유도 거기 적었다(21,000바이트 한도).
          if [ "${EXECUTED:-0}" -lt 3875 ]; then
            echo "::error::실행 ${EXECUTED}건 — 하한 3875 미만. 테스트가 사라졌거나 스위트가 중간에 죽었다."
            exit 1
          fi

          # (타깃 존재 검사 — 하한이 못 잡는 소실) — 근거는 이 스텝 위 YAML 주석에 있다.
          # run 블록 밖으로 옮긴 이유도 거기 적었다(21,000바이트 한도).
          python3 - <<'PYEOF' || exit 1
          import pathlib, re, sys

          log = pathlib.Path("test-output.log").read_text(encoding="utf-8", errors="replace")
          ran = set(re.findall(r"Test Suite '([A-Za-z0-9_]+)'", log))
          ran |= set(re.findall(r"Test Case '-\[[A-Za-z0-9_]+\.([A-Za-z0-9_]+) ", log))

          # 기대 목록의 정본은 `Package.swift` 의 `.testTarget` 선언이다 — `Tests/` 순회가
          # 아니다. 근거는 위 [정정 2026-08-30]. 뽑기 자체가 실패하면 그것도 사고다.
          manifest = pathlib.Path("Package.swift").read_text(encoding="utf-8")
          declared = sorted(set(re.findall(
              r'\.testTarget\(\s*name:\s*"([A-Za-z0-9_]+)"', manifest)))
          if len(declared) < 7:
              print(f"::error::Package.swift 의 .testTarget 선언이 {len(declared)}개 — 하한 7 미만. "
                    f"타깃 선언이 사라졌거나 파싱이 낡았다: {declared}")
              raise SystemExit(1)

          targets = sorted(d for d in pathlib.Path("Tests").iterdir() if d.is_dir())
          if len(targets) < 7:
              print(f"::error::테스트 타깃 디렉터리가 {len(targets)}개 — 하한 7 미만. "
                    f"타깃이 통째로 사라졌다: {[d.name for d in targets]}")
              raise SystemExit(1)

          # 선언됐는데 디렉터리가 없는 것도 사고다(종전엔 순회 기준이라 보이지 않았다).
          have = {d.name for d in targets}
          absent = [n for n in declared if n not in have]
          if absent:
              print(f"::error::Package.swift 가 선언한 테스트 타깃의 디렉터리가 없다: {absent}")
              raise SystemExit(1)

          missing, empty, rows = [], [], []
          for d in targets:
              classes = set()
              for f in d.rglob("*.swift"):
                  classes |= set(re.findall(r"class\s+([A-Za-z0-9_]+)\s*:\s*XCTestCase",
                                            f.read_text(encoding="utf-8", errors="replace")))
              if not classes:
                  # 선언된 타깃이 XCTestCase 를 0개 내면 **사고다** — 넘기지 않는다.
                  if d.name in declared:
                      empty.append(d.name)
                  continue                      # 클래스가 없는 지원 전용 디렉터리는 대상이 아니다
              hit = classes & ran
              rows.append((d.name, len(classes), len(hit)))
              if not hit:
                  missing.append((d.name, sorted(classes)[:5]))

          for name, total, hit in rows:
              print(f"  {name}: 선언 {total} · 로그에서 확인 {hit}")
          if empty:
              for name in empty:
                  print(f"::error::타깃 `{name}` 은 Package.swift 가 `.testTarget` 으로 선언했는데 "
                        f"`Tests/{name}/` 에서 `XCTestCase` 클래스를 **0개** 냈다 — "
                        f"소스가 지워졌다. 선언된 타깃에는 지원 전용 예외를 적용하지 않는다.")
              raise SystemExit(1)
          if missing:
              for name, sample in missing:
                  print(f"::error::타깃 `{name}` 의 테스트 클래스가 실행 로그에 **하나도** 없다 — "
                        f"번들이 안 실렸거나 타깃이 빠졌다. 예: {sample}")
              raise SystemExit(1)
          print(f"타깃 존재 게이트 통과 — 선언 {len(declared)}개 · 검사 {len(rows)}개 타깃 "
                f"전부 실행 로그에 나타난다.")
          PYEOF

      # [주석 정정 2026-08-21] **고아 주석 회수 — `1fb7ad2` 가 잡은 것과 같은 부류의 세 번째 건.**
      # 아래 두 줄(grep 패턴의 근거)은 `978c9dd` 에서 이 스텝 바로 위에 적혔는데, 그 뒤
      # `c9d627c` 가 `Upload synthetic golden baseline` 을 **주석과 그 스텝 사이에** 끼워 넣어
      # 근거가 남의 스텝에 얹혔다(diff 실측: `+      - name: Upload synthetic golden baseline` 이
      # 그 두 줄 바로 다음 줄에 삽입됐다). 2026-08-19 스윕이 golden 스텝의 자기 근거를 그 아래에
      # 덧붙이면서 두 문단이 한 덩어리가 됐고, 그래서 이 스텝은 **자기 grep 패턴의 근거가 없는 채**,
      # golden 스텝은 **자기와 무관한 로그 파싱 이야기를 머리에 인 채** 돌고 있었다.
      # 스텝을 옮기거나 끼워 넣을 때 근거 주석이 따라가지 않는 것이 이 리포의 상습 결함이다.
      #
      # 실패 원인부터 먼저 뽑는다 — 종전 패턴("failed" 포함)은 정상 로그의 "load failed"·"save failed"
      # 진단문에 파묻혀 실제 실패 단언이 head -50 밖으로 밀려났다(런 30541571683 에서 실측).
      #
      # `failure()` 만으로는 release 레인이 빠진다(위 Test 스텝 주석 참조).
      # `steps.test.outcome` 은 continue-on-error 가 삼키기 **전**의 결과라 release 실패도 잡는다.
      - name: Show failure summary
        if: failure() || steps.test.outcome == 'failure'
        run: |
          # 테스트까지 못 간 실패(빌드 단계)면 로그가 없다. 그때 이 스텝이 같이 죽으면
          # 잡의 실패 원인이 둘로 보여 진단이 흐려진다 — 없으면 그렇다고만 말하고 끝낸다.
          if [ ! -f test-output.log ]; then
            echo "test-output.log 없음 — 빌드 단계에서 중단됐다. 위 Build 스텝 로그를 볼 것."
            exit 0
          fi
          echo "--- failing assertions ---"
          grep -E "error: -\[|' failed \(" test-output.log | head -40 || true
          echo "--- compile errors ---"
          grep -E "error: .*(type-check|cannot|unable)" test-output.log | head -20 || true
          echo "--- tail ---"
          tail -60 test-output.log

  # 수동 재생성은 한 잡의 같은 checkout 에서 **직렬**로 돈다. debug 가 만든 파일을 release 가
  # 그대로 읽어 검증한 뒤에만 아티팩트를 올린다. 매트릭스 두 잡에 bootstrap=1 을 주면 서로
  # 격리된 기준선을 각자 만들어 비교가 자기참조가 되므로 이 흐름을 대신할 수 없다.
  golden-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.golden_bootstrap
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build synthetic golden tests (debug)
        run: swift build --build-tests -c debug

      - name: Capture synthetic golden baseline (debug)
        env:
          WAPLE_GOLDEN_BOOTSTRAP: "1"
        run: |
          # 기존 PNG 를 지워 Metal 부재/조기 스킵이 기존 파일을 새 산출물처럼 올리지 못하게 한다.
          find spec/golden/synthetic -type f -name '*.png' -delete
          swift test --skip-build -c debug --filter SyntheticPixelGoldenTests
          test -n "$(find spec/golden/synthetic -type f -name '*.png' -print -quit)" || {
            echo "::error::debug 부트스트랩이 PNG 를 하나도 만들지 않았다"
            exit 1
          }

      - name: Build synthetic golden tests (release)
        run: swift build --build-tests -c release -Xswiftc -enable-testing

      - name: Validate synthetic golden baseline (release)
        env:
          WAPLE_GOLDEN_BOOTSTRAP: "0"
        run: swift test --skip-build -c release -Xswiftc -enable-testing --filter SyntheticPixelGoldenTests

      - name: Upload synthetic golden baseline
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-golden-baseline
          path: spec/golden/synthetic/
          if-no-files-found: error
