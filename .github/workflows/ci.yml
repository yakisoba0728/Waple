name: CI

# 문서만 바뀐 푸시로 macOS 러너를 태우지 않는다(README/BACKLOG/docs 커밋이 잦다).
# 코드 경로가 하나라도 섞이면 정상 실행된다 — paths-ignore 는 전 변경이 목록에 들 때만 스킵.
#
# [2026-08-19] 이 무시 목록에 **구멍이 있었다**: spec 정본의 근거 중 `.md` 파일이 있어서
# (`shape-quad.json` · `nondeterminism.json` 의 확정 4항목) 그 `.md` 만 지우는 커밋이
# 근거를 끊으면서 검증을 통째로 건너뛰었다. 해결책은 이 목록을 벗기는 게 아니라 —
# 그러면 문서 커밋마다 macOS 러너 두 대가 돈다 — **Linux 검사만 떼어내는 것**이다.
# `spec.yml` 이 paths-ignore 없이 항상 돈다. 여기 남은 것은 macOS 잡뿐이다.
#
# [2026-08-02] `branches: [main]` 제한을 없앤다. 기능 브랜치에 직접 푸시하는 흐름
# (feat/we-engine-port-design 처럼 PR 없이 오래 사는 브랜치)에서 CI 가 **조용히 안 돌았다** —
# 8커밋을 푸시하고도 검증이 0이었고, 그 사실을 알아채는 신호도 없었다.
# 대신 아래 concurrency 를 head_ref 기준으로 묶어 PR 과 push 가 같은 브랜치를 두 번 태우지 않게 한다.
on:
  push:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE", ".gitignore", ".gitattributes"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE", ".gitignore", ".gitattributes"]
  workflow_dispatch:   # 브랜치에서 손으로 돌려 워크플로 자체를 반복 검증(PR 없이)
    inputs:
      golden_bootstrap:
        description: "합성 픽셀 골든 기준선을 다시 뜬다 — 아티팩트로 받아 눈으로 확인한 뒤 커밋할 것"
        type: boolean
        default: false

# 같은 브랜치를 연달아 푸시하면 앞 실행을 취소한다 — 한 브랜치 상태당 실행 1회.
#
# [주석 정정 2026-08-19] 종전 주석은 "push 와 pull_request 가 같은 그룹에 묶인다" 고 적었는데
# **그렇지 않다**: `head_ref` 는 pull_request 계열에서만 채워지므로 push 는 `refs/heads/<br>`,
# PR 은 `<br>` 로 **다른 그룹**이 된다. 이 리포는 PR 을 쓰지 않아(전체 82런 중 pull_request 0건)
# 실제 비용은 0 이지만, 주석이 하는 주장은 사실이 아니었다. PR 을 쓰기 시작하면 같은 커밋이
# 두 번 돈다 — 그때는 키를 `github.event.pull_request.head.sha || github.sha` 꼴로 바꿔야 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # [2026-08-19] 단일 잡을 구성 매트릭스로 나눈다.
  #
  # 종전 CI 는 debug 만 빌드했다. 그런데 골든 기준선은 전부 **release** 캡처이고,
  # scripts/mac-session/verify-plan-b12.sh:160-161 이 코드 변경 없이 debug↔release 가
  # 30씬/최대델타 249 만큼 갈린다고 실측해 뒀다 — 즉 CI 가 통과시키는 바이너리와
  # 골든을 뜬 바이너리가 서로 다른 것이었다. 두 구성을 함께 세운다.
  #
  # fail-fast: false 가 핵심이다. 한쪽이 깨져도 다른 쪽을 끝까지 돌려야 "release 만
  # 깨지는가 / 둘 다 깨지는가" 를 한 번의 실행으로 가른다 — 이게 없으면 진단에
  # 왕복이 한 번 더 든다.
  swift:
    name: swift · ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: debug
            testFlags: ""
          # release 에서 `@testable import` 는 대상 모듈이 -enable-testing 으로 빌드돼야
          # 컴파일된다. SwiftPM 은 그 플래그를 **debug 에만** 자동으로 넣으므로
          # `swift build --build-tests -c release` 는 그대로는 반드시 실패한다
          # (실측: WapleSnapshot 'was not compiled for testing'). release 를 CI 에서
          # 한 번도 세우지 않아 드러난 적이 없었을 뿐이다.
          - configuration: release
            testFlags: "-Xswiftc -enable-testing"
    # macos-14 는 deprecated 이고 이미지 최신 Xcode 가 16.2(Swift 6.0.3) — 이 코드베이스의
    # 타입체커 한계 진단이 로컬(Swift 6.4)과 갈려 CI 전용 컴파일 에러를 냈다. macos-26 은
    # 기본 Xcode 26.x 로 로컬 툴체인과 정합하고, 러너 세대도 최신이라 컴파일이 빠르다.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 러너 실측치 기록: 코어 수/메모리/Xcode 목록 — 잡 시간 예산과 병렬화 판단의 근거.
      - name: Runner + toolchain facts
        run: |
          sw_vers
          echo "image=${ImageVersion:-unknown} cores=$(sysctl -n hw.ncpu) mem=$(( $(sysctl -n hw.memsize) / 1024 / 1024 ))MB"
          xcodebuild -version
          swift --version
          ls -d /Applications/Xcode*.app

      # .build 캐시는 두지 않는다 — 단, "무용" 이 실측된 건 아니다(측정 불능이 정확한 표현).
      # Build 스텝 실측: 캐시 적중 53s(30542156132, n=1) vs 캐시 없음 57·59·77·119s
      # (30543293662·30541571683·30543828036·30542607905). 동일 조건 간 변동폭(62s)이 캐시 유무 차이를
      # 압도해 3코어 공용 러너에서는 n=1 로 판별이 안 된다. 제거 근거는 속도가 아니라 ①zero-dep 라
      # 캐시에 담기는 게 오브젝트뿐이고 llbuild 는 파일 시그니처 판정인데 checkout 이 매 런 mtime 을
      # 새로 준다(이론상 전량 재컴파일) ②동일 키 재저장이 매 런 "Failed to save: Unable to reserve
      # cache" 를 남겨 실패로 오해된다 ③135MB 캐시 저장 비용.
      # 재도입을 판단하려면 조건별 5런 이상 중앙값을 비교할 것(약 50분) — 5분 잡의 ≤20s 이슈다.

      # 빌드와 테스트 실행을 분리한다 — 종전엔 `swift build` 뒤 `swift test` 가 테스트 타깃을
      # 다시 컴파일해, 스텝 시간이 "컴파일 + 실행" 으로 뭉쳐 어디가 느린지 알 수 없었다.
      # 배포되는 구성 그대로를 먼저 세운다 — 테스트 플래그가 섞이지 않은 상태.
      # release 에서 이 스텝이 곧 "출하 바이너리가 컴파일되는가" 의 답이다.
      - name: Build (sources)
        run: |
          set -o pipefail
          swift build -c ${{ matrix.configuration }} 2>&1 | tee build-output.log

      # [2026-08-19] 엄격 동시성 전환의 작업 목록을 만든다.
      #
      # Package.swift 가 -strict-concurrency=complete 를 **경고로** 켜 뒀다(주석 참조).
      # 경고는 빌드를 세우지 않으므로 그냥 두면 수천 줄 로그에 묻힌다 — 파일:행 단위로
      # 세어 요약에 남기고, 전문은 아티팩트로 올려 다음 작업의 입력으로 쓴다.
      # 이 숫자가 0 이 되면 언어 모드를 .v6 로 올릴 수 있다.
      - name: Concurrency diagnostics census
        if: always() && matrix.configuration == 'debug'
        run: |
          [ -f build-output.log ] || { echo "빌드 로그 없음"; exit 0; }
          TOTAL=$(grep -c "warning:" build-output.log || true)
          echo "### 엄격 동시성 진단 (${{ matrix.configuration }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "총 warning: \`${TOTAL:-0}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 건수 | 파일 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ---: | --- |" >> "$GITHUB_STEP_SUMMARY"
          grep "warning:" build-output.log \
            | sed -E 's|^/Users/runner/work/Waple/Waple/||; s|:[0-9]+:[0-9]+: warning:.*||' \
            | sort | uniq -c | sort -rn | head -30 \
            | awk '{printf "| %s | `%s` |\n", $1, $2}' >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>진단 종류별</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -oE "warning: .*" build-output.log \
            | sed -E "s/'[^']*'/'X'/g" \
            | sort | uniq -c | sort -rn | head -25 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      # release 빌드 로그도 올린다 — 이 레인의 존재 이유가 최적화 의존 결함인데
      # 종전엔 debug 것만 올라와 정작 필요한 쪽 로그가 없었다.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.configuration }}
          path: build-output.log
          if-no-files-found: ignore

      # 테스트 타깃은 위 matrix 주석의 이유로 release 에서만 플래그가 붙는다.
      # 그래서 release 는 라이브러리를 두 번 컴파일한다(플래그가 달라 재사용 불가) —
      # 비용을 아는 채로 감수한다. debug 레인이 빠른 차단 게이트이고, 이 레인의
      # 목적은 최적화 의존 결함(부동소수 재결합·경계 조건)을 드러내는 것이다.
      - name: Build (tests)
        run: swift build --build-tests -c ${{ matrix.configuration }} ${{ matrix.testFlags }}

      # 화면보호기(Sources/WapleSaver)는 SPM 밖 Obj-C 라서 swift test 커버리지 밖.
      # package-app.sh 의 clang 블록과 동일한 플래그로 번들 컴파일만 검증(서명/DMG 불요).
      # 구성과 무관한 검사라 debug 레인에서만 한 번 돈다.
      - name: Compile screensaver bundle
        if: matrix.configuration == 'debug'
        run: |
          OUT="$(mktemp -d)/WapleSaver"
          xcrun clang -fobjc-arc -bundle -mmacosx-version-min=13.0 \
            -framework AppKit -framework AVFoundation -framework CoreMedia \
            -framework QuartzCore -framework ScreenSaver \
            Sources/WapleSaver/WapleSaverView.m \
            -o "$OUT"

      # release 테스트는 **보고 전용**이다. 위 verify-plan-b12 실측대로 두 구성은 픽셀이
      # 갈리므로, release 실패가 곧 회귀는 아니다. 그런데도 돌리는 이유는 release 에서만
      # 나는 최적화 의존 결함(부동소수 재결합, 경계 조건)이 실제로 있기 때문이다.
      # debug 는 그대로 차단 게이트로 둔다.
      #
      # [2026-08-19] 그런데 그 "보고" 가 실제로는 **아무 데도 보고하지 않고 있었다**.
      # `continue-on-error` 스텝의 실패는 job conclusion 을 failure 로 만들지 않으므로
      # 아래 `Show failure summary`(if: failure())가 release 레인에서는 **한 번도 실행되지
      # 않았다**(실측: run 32218275170 · 32230929535 에서 debug 는 실행, release 는 skipped).
      # 즉 최적화 의존 결함이 나와도 CI 는 통째로 초록이고, 매 푸시 macOS 러너 ~10분을 쓰면서
      # 자동 검출은 0이었다. `continue-on-error` 자체는 위 근거대로 유지하되,
      # `steps.test.outcome`(continue-on-error **이전**의 결과)으로 요약과 경고를 되살린다.
      - name: Test
        id: test
        continue-on-error: ${{ matrix.configuration == 'release' }}
        env:
          # 평소엔 0 — 기준선이 없으면 SyntheticPixelGoldenTests 가 **실패**한다(도장이 되지 않게).
          # workflow_dispatch 로 golden_bootstrap 을 켤 때만 기준선을 다시 뜬다.
          WAPLE_GOLDEN_BOOTSTRAP: ${{ inputs.golden_bootstrap && '1' || '0' }}
        run: |
          set -o pipefail
          swift test --skip-build -c ${{ matrix.configuration }} ${{ matrix.testFlags }} 2>&1 | tee test-output.log

      # [2026-08-19] 병렬 격리 회귀 게이트 — debug 레인에서만.
      #
      # `AGENTS.md` 는 오래 "`--parallel` 은 통과/실패 판정에 쓰지 마라 — `SceneRenderSettingsTests`
      # 와 `SceneCompositeConventionTests` 가 병렬 3/3 실패" 라고 적고 원인을 미확정으로 뒀다.
      # 원인은 둘 다 **공유 자원**이었다:
      #   · SceneRenderSettings 가 `UserDefaults.standard`(프로세스가 아니라 **사용자** 단위)를 직접 씀
      #   · SceneCompositeConventionTests 가 출력만 리터럴 `/tmp/waple_cc_<tag>` 로 씀
      # 둘 다 고쳤다(주입 저장소 · PID 스코프). 그런데 **고쳤다는 것과 병렬이 통과한다는 것은
      # 다른 명제**라, 실행으로 확인하지 않으면 다음 사람이 다시 미확정으로 돌려놓는다.
      #
      # 세 번 돌린다 — 경합은 한 번으로는 안 잡힌다. 실패하면 원인이 하나 더 남아 있는 것이다.
      # 전 스위트가 아니라 이 두 클래스만 돌리므로 비용은 수십 초다.
      # [2026-08-19] 병렬 격리 회귀 게이트 — debug 레인에서만.
      #
      # `AGENTS.md` 는 오래 "`--parallel` 은 통과/실패 판정에 쓰지 마라 — 두 클래스가 병렬 3/3 실패"
      # 를 싣고 원인을 미확정으로 뒀다. 원인은 **둘 다 공유 자원**이었고 서로 달랐다:
      #   · SceneRenderSettings 가 `UserDefaults.standard`(프로세스가 아니라 **사용자** 단위)를 직접 씀
      #     → 테스트마다 고유 suite 주입. **이건 실측으로 해소 확인됐다**(이 게이트 1차 실행).
      #   · SceneCompositeConventionTests 의 두 캡처 테스트가 프로세스 전역 `fitMode` 를 서로 덮음
      #     → 한 테스트로 합침. 1차 실행에서 회차마다 지는 쪽이 바뀌는 것으로 경합을 확인했다.
      #
      # **판정은 로그 문자열이 아니라 `--xunit-output` XML 로 한다.** 1차 판이 로그를 보다가
      # 오판했다 — `--parallel` 은 전부 통과하면 XCTest 의 `Executed N tests` 줄을 안 찍는데
      # 그걸 "필터가 0건 매치" 로 읽어 통과한 클래스를 실패로 보고했다. 이 리포가 반복해서
      # 당한 "검사하는 척하는 검사" 를 내가 그대로 만든 셈이라, 기계가 읽는 형식으로 바꾼다.
      # release 실패는 잡을 빨갛게 만들지 않는다(픽셀 분기가 정당한 실패를 낳는다).
      # 그래도 **조용히 지나가서는 안 된다** — 실행 페이지 상단에 경고로 띄우고 요약에도 남긴다.
      # 이게 없으면 초록 실행의 로그를 여는 사람이 없어 레인이 사실상 무의미해진다.
      #
      # [2026-08-20] **이 스텝은 반드시 `Test` 뒤에 있어야 한다.** 종전엔 `Test`(id: test)보다
      # 위(빌드 직후)에 있었는데, GitHub Actions 의 `steps` 컨텍스트는 **이미 실행된 스텝만**
      # 담는다. 그래서 `steps.test.outcome` 이 항상 null 이고 `null == 'failure'` 는 항상
      # false — 도입 이후 모든 실행에서 `skipped` 였다(실측: run 32313417567 의 debug·release
      # 양쪽 스텝 6번이 skipped). 참조하는 `test-output.log` 도 `Test` 가 tee 로 만드는 파일이라
      # 그 자리에선 존재할 수조차 없었다. "조용한 게이트를 실제 게이트로 만든다" 던 스텝이
      # 정작 자기가 조용한 게이트였다.
      - name: Flag release-only failure
        if: matrix.configuration == 'release' && steps.test.outcome == 'failure'
        run: |
          echo "::warning title=release 레인 테스트 실패::debug 는 통과했는데 release 가 실패했다 — 최적화 의존 결함(부동소수 재결합·경계 조건)일 수 있다. 이 잡은 설계상 초록으로 남는다."
          {
            echo "### ⚠️ release 전용 실패"
            echo ""
            echo "debug 레인과 달리 release 레인에서 테스트가 실패했다. 이 잡은 설계상 초록이지만"
            echo "(두 구성은 픽셀이 갈린다) **최적화 의존 결함일 가능성**이 있으므로 확인이 필요하다."
            echo ""
            echo '```'
            grep -E "error:|XCTAssert.*failed|failed \\(" test-output.log 2>/dev/null | head -25 || echo "(test-output.log 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parallel isolation gate
        if: matrix.configuration == 'debug'
        run: |
          set -uo pipefail
          fail=0
          for cls in SceneRenderSettingsTests SceneCompositeConventionTests; do
            for i in 1 2 3; do
              xml="parallel-$cls-$i.xml"
              log="parallel-$cls-$i.log"
              swift test -c debug --parallel --num-workers 6 --filter "$cls" \
                --xunit-output "$xml" > "$log" 2>&1 || true
              python3 - "$xml" "$log" "$cls" "$i" <<'PYEOF' || fail=1
          import re, sys, xml.etree.ElementTree as ET
          path, logpath, cls, run = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          try:
              root = ET.parse(path).getroot()
          except Exception as e:
              print(f"::error::{cls} #{run}: xunit XML 을 못 읽었다 ({e}) — 테스트가 아예 안 돌았다")
              raise SystemExit(1)
          tests = fails = errors = 0
          for s in root.iter("testsuite"):
              tests += int(s.get("tests", 0)); fails += int(s.get("failures", 0)); errors += int(s.get("errors", 0))
          if tests == 0:
              print(f"::error::{cls} #{run}: 실행된 테스트 0건 — 필터가 못 잡았다(게이트가 도장이 된다)")
              raise SystemExit(1)
          # [2026-08-20] **스킵을 통과로 세면 안 된다.** SwiftPM 의 XUnitGenerator 는
          # tests 에 스킵을 포함하고 `<skipped/>` 를 쓰지 않으며 errors 는 "0" 하드코딩이다 —
          # 즉 XML 만 봐서는 스킵을 구분할 수 없다. 그런데 대상 클래스는 전원 Metal 가드
          # (SceneCompositeConventionTests 는 func test 16 / XCTSkip 16)라, GPU 없는 러너에서
          # 16건 전부 스킵돼도 종전 판정은 "16건 통과" 를 **적극적으로 거짓 출력**했다.
          # 이 게이트의 초록이 AGENTS.md 의 `--parallel` 허용 근거이므로 그건 도장이다.
          # 그래서 실행 로그에서 스킵을 직접 센다(census 스텝과 같은 신호). 스킵이 하나라도
          # 있으면 이 게이트는 **아무것도 증명하지 못한 것**이므로 통과시키지 않는다.
          try:
              logtext = open(logpath, encoding="utf-8", errors="replace").read()
          except OSError as e:
              print(f"::error::{cls} #{run}: 실행 로그를 못 읽었다 ({e}) — 스킵 여부를 판정할 수 없다")
              raise SystemExit(1)
          skipped = len(re.findall(r"' skipped \(", logtext))
          if skipped:
              print(f"::error::{cls} #{run}: {tests}건 중 {skipped}건이 **스킵**됐다 — "
                    f"이 게이트는 공유 자원 격리를 증명하지 못했다(GPU 부재 러너로 보인다). "
                    f"스킵을 통과로 세지 않는다.")
              raise SystemExit(1)
          if fails or errors:
              print(f"::error::{cls} #{run}: {tests}건 중 실패 {fails} 오류 {errors} — 공유 자원이 남아 있다")
              for tc in root.iter("testcase"):
                  if list(tc):
                      print(f"    ✗ {tc.get('classname')}.{tc.get('name')}")
              raise SystemExit(1)
          print(f"  {cls} #{run}: {tests}건 실행·통과(스킵 0)")
          PYEOF
            done
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "병렬 격리 OK — 두 클래스 × 3회"

      # [2026-08-19] 스킵 가시화 **및 게이트**.
      #
      # XCTSkip("no Metal") 이 76개 파일 322곳에 걸쳐 있고 그 아래 테스트가 561개다.
      # 스킵은 통과로 집계되므로, 러너 이미지가 바뀌거나 GPU 가 없는 세션에서 돌면
      # **전부 스킵된 채 초록**이 뜬다 — 통과 수를 세는 것만으로는 알아챌 수 없다.
      # 처음엔 숫자만 남기는 단계로 뒀고, 두 번의 실측(run 32219037798 debug·release)으로
      # 정상 범위가 섰으므로 이제 하한/상한을 건다. 값과 근거는 아래 if 문 주석에.
      - name: Skip / execution census
        if: always()
        run: |
          echo "### swift · ${{ matrix.configuration }}" >> "$GITHUB_STEP_SUMMARY"
          # 빌드가 먼저 깨지면 로그 자체가 없다 — 그 사실을 요약에 남긴다.
          # (종전엔 파일 없음이 그대로 스텝 실패가 되어 진짜 실패 원인을 가렸다.)
          if [ ! -f test-output.log ]; then
            echo "- 테스트 미실행(빌드 단계에서 중단)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SKIPPED=$(grep -c "' skipped (" test-output.log || true)
          EXECUTED=$(grep -oE "Executed [0-9]+ test" test-output.log | tail -1 | grep -oE "[0-9]+" || echo 0)
          echo "- executed: \`${EXECUTED}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- skipped:  \`${SKIPPED}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "executed=${EXECUTED} skipped=${SKIPPED}"

          # [2026-08-19] 트립와이어. 이제 정상 범위를 안다.
          # [2026-08-21] 실측 갱신: executed **2627** / skipped 47 / 실패 0
          # (run 32438254862 · 커밋 8ccedd3 의 debug 잡). 하한을 2459 → 2627 로 올린다.
          # 래칫 규약(하한 = 직전 실측치)대로다 — 여유가 168 까지 벌어져 있었다.
          # 이번에 는 168 의 출처: GLSL 동봉 셰이더 전수 회귀 18 · 스켈레톤 WE 대조 13 ·
          # 심플렉스 노이즈 20 · 파티클 공유난수/월드중력 15 · 관용 JSON CRLF 6 ·
          # 이펙트 functions/compose 6 · project.json 6 · .mdl 프레이밍 8 ·
          # 오디오 엔벨로프 4 · WaplePolicy 74.
          # [2026-08-20] 실측 갱신: executed **2459** / skipped 46 / 실패 0
          # (run 32398914480 기준 2452 → remapvalue 어휘 1건 + 관용 JSON 6건 추가로 2459). 같은 시점의 정적 개수
          # (`grep -rE '^\s*(public |private |internal )?func test' Tests/ --include=*.swift | wc -l`)도
          # 정확히 2459 다 — 두 세는 법이 어긋나지 않는다는 것을 실측으로 확인했다.
          #
          # **[2026-08-20] 근거가 하한보다 낡아 있었다.** 이 주석은 `2369`(커밋 c109ac1)를 인용하는데
          # 강제되는 하한은 그 뒤로 2371 → 2372 → 2374 → 2382 → 2390 으로 다섯 번 더 올라갔다.
          # 즉 "근거로 적힌 숫자"와 "실제로 막는 숫자"가 서로 다른 말을 하고 있었다 — 이 리포가
          # 반복해서 잡아내는 바로 그 부류(주석과 코드가 어긋난 채 초록)를 이 게이트 자신이 앓고 있었다.
          # 게이트 동작 자체는 정상이었지만(2452 ≥ 2390) 여유가 62 로 벌어져 **감도가 그만큼 무뎠다**:
          # 테스트 62개가 사라져도 통과한다. 래칫 규약(하한 = 직전 실측치)대로 2452 로 되돌린다.
          #
          # 막으려는 것은 **대량 무음 스킵**이다. XCTSkip("no Metal") 아래 테스트가 561개인데
          # 스킵은 통과로 집계되므로, 러너 이미지가 바뀌거나 GPU 없는 세션에서 돌면 전부
          # 스킵된 채 초록이 뜬다 — 통과 수만 봐서는 알아챌 수 없다. 상한을 100 으로 둔다:
          # 정상치의 두 배 여유가 있어 흔들리지 않고, 561 이 되는 실패 양상은 확실히 잡는다.
          if [ "${SKIPPED:-0}" -gt 100 ]; then
            echo "::error::스킵 ${SKIPPED}건 — 상한 100 초과. GPU/코퍼스 없이 대량 스킵되고 있을 가능성이 크다."
            exit 1
          fi
          # 테스트 수는 늘기만 한다(줄면 파일이 빠졌거나 번들이 안 실렸다는 뜻).
          if [ "${EXECUTED:-0}" -lt 2627 ]; then
            echo "::error::실행 ${EXECUTED}건 — 하한 2627 미만. 테스트가 사라졌다."
            exit 1
          fi

      # 실패 원인부터 먼저 뽑는다 — 종전 패턴("failed" 포함)은 정상 로그의 "load failed"·"save failed"
      # 진단문에 파묻혀 실제 실패 단언이 head -50 밖으로 밀려났다(런 30541571683 에서 실측).
      # debug 구성에서만 뜬다. 이건 **구조적 위험이 아니라 검증된 선택**이다:
      # 기준선은 한 벌이어야 하는데(두 구성이 각자 뜨면 어느 쪽이 정본인지 사라진다),
      # debug 로 뜬 그 한 벌을 **release 레인이 매 실행 검증한다** — 위 `Test` 스텝은 두 구성
      # 모두에서 `SyntheticPixelGoldenTests` 를 돌리고, 기준선이 구성에 의존했다면 release 가
      # 어긋나 실패한다. 즉 "debug 전용 캡처" 의 위험은 이미 상시 게이트로 덮여 있다.
      # (2026-08-19 스윕 §3-19 판정 — 근거 없는 구조적 우려로 남아 있던 항목이다.)
      - name: Upload synthetic golden baseline
        if: always() && inputs.golden_bootstrap && matrix.configuration == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-golden-baseline
          path: spec/golden/synthetic/
          if-no-files-found: warn

      # `failure()` 만으로는 release 레인이 빠진다(위 Test 스텝 주석 참조).
      # `steps.test.outcome` 은 continue-on-error 가 삼키기 **전**의 결과라 release 실패도 잡는다.
      - name: Show failure summary
        if: failure() || steps.test.outcome == 'failure'
        run: |
          # 테스트까지 못 간 실패(빌드 단계)면 로그가 없다. 그때 이 스텝이 같이 죽으면
          # 잡의 실패 원인이 둘로 보여 진단이 흐려진다 — 없으면 그렇다고만 말하고 끝낸다.
          if [ ! -f test-output.log ]; then
            echo "test-output.log 없음 — 빌드 단계에서 중단됐다. 위 Build 스텝 로그를 볼 것."
            exit 0
          fi
          echo "--- failing assertions ---"
          grep -E "error: -\[|' failed \(" test-output.log | head -40 || true
          echo "--- compile errors ---"
          grep -E "error: .*(type-check|cannot|unable)" test-output.log | head -20 || true
          echo "--- tail ---"
          tail -60 test-output.log
