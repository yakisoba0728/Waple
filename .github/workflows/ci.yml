      # (하한도 못 잡았다 — 그때 여유가 101 이라 3,875-74=3,801 이 3,774 를 넘겼다.
      #  그 여유는 위 [2026-08-30 래칫] 이 0 으로 닫았지만, 오라클을 더하는 순간 여유가
      #  다시 벌어지므로 개수 게이트로는 이 구멍이 **원리적으로** 안 닫힌다 — 위 문단들이
